databases:
  - name: po-automation-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: po-automation
    runtime: node
    plan: free
    rootDir: web
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npx tsx prisma/seed.ts && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: po-automation-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: NODE_ENV
        value: production
