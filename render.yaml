services:
  - type: web
    name: po-automation
    runtime: node
    plan: free
    rootDir: web
    buildCommand: npm ci --include=dev && npx prisma generate && npx prisma migrate deploy && npx tsx prisma/seed.ts && npm run build
    startCommand: npm start
    envVars:
      # Supabase: pooled connection (port 6543, Supavisor in transaction mode).
      # Used by the running app. Append ?pgbouncer=true&connection_limit=1 to the URL.
      - key: DATABASE_URL
        sync: false
      # Supabase: direct connection (port 5432). Used by Prisma for migrations only.
      - key: DIRECT_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: NODE_ENV
        value: production
      # Modal VLM sidecar — modal-vlm/. Paste the URL from `modal deploy` output.
      - key: MODAL_VLM_URL
        sync: false
      # Shared bearer token — same value on Modal (as secret 'po-automation-secrets')
      # and here. Generate with: python -c "import secrets; print(secrets.token_hex(32))"
      - key: MODAL_AUTH_TOKEN
        sync: false
