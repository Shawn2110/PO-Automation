name: Deploy Modal VLM

on:
  push:
    branches:
      - main
    paths:
      - "modal-vlm/**"
      - ".github/workflows/deploy-modal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-modal-vlm
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy po-automation-vlm
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: modal-vlm/requirements.txt

      - name: Install Modal
        run: python -m pip install "modal>=0.66.0"

      - name: Deploy Modal app
        run: modal deploy modal-vlm/app.py
